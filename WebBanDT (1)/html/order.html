<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Quản lý đơn hàng</title>

    <link rel="stylesheet" href="../css/admin/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* chỉ thêm nhẹ, không phá layout */
        .status-pending { color: orange; }
        .status-shipping { color: #3b82f6; }
        .status-success { color: #22c55e; }
        .status-cancel { color: red; }

        .order-detail {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.4);
            z-index: 999;
        }

        .order-detail-box {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 420px;
        }

        .order-item-row {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
        }

        .order-detail-box button {
            margin-top: 10px;
            padding: 6px 12px;
            border: none;
            background: red;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<script src="../js/auth-check.js"></script>

<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="logo">ADMIN</div>

        <ul>
            <li><a href="admin.html"><i class="fa fa-chart-line"></i> Dashboard</a></li>
            <li><a href="acount.html"><i class="fa fa-user"></i> Quản lý tài khoản</a></li>
            <li><a href="product.html"><i class="fa fa-mobile"></i> Quản lý sản phẩm</a></li>
            <li class="active"><a href="order.html"><i class="fa fa-box"></i> Quản lý đơn hàng</a></li>
            <li><a href="categories.html"><i class="fa fa-warehouse"></i> Quản lý danh mục</a></li>
            <li><a href="coupon.html"><i class="fa fa-ticket"></i> Mã giảm giá</a></li>
            <li><a href="review.html"><i class="fa fa-star"></i> Đánh giá</a></li>
        </ul>

        <button class="logout" id="btnLogout">
            <i class="fa fa-sign-out"></i> Đăng xuất
        </button>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="topbar">
            <h2 class="page-title">Quản lý đơn hàng</h2>
        </div>

        <!-- TABLE -->
        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>Mã đơn</th>
                        <th>Khách hàng</th>
                        <th>Sản phẩm</th>
                        <th>Tổng tiền</th>
                        <th>Ngày đặt</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>

                <tbody id="orderTable"></tbody>
            </table>
        </div>

    </div>
</div>

<!-- ✅ POPUP (ĐẶT NGOÀI TABLE) -->
<div class="order-detail" id="orderDetail">
    <div class="order-detail-box">
        <h3>Chi tiết đơn hàng</h3>
        <div id="orderDetailContent"></div>
        <button onclick="closeDetail()">Đóng</button>
    </div>
</div>

<script src="../js/admin/adminLoadOrder.js"></script>

</body>
</html>
