<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>PhoneShop | Điện thoại chính hãng</title>

    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/cart.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <header class="header">

        <div class="header-container">

            <!-- LOGO -->

            <div class="logo">
                <img src="../img/logo.jpg">
                <span>PhoneShop</span>
            </div>

            <!-- DANH MỤC -->

            <div class="dropdown">

                <button class="dropbtn">
                    Danh mục <i class="fa fa-chevron-down"></i>
                </button>

                <div class="dropdown-content" id="categoryMenu">

                </div>

            </div>

            <!-- SEARCH -->

            <div class="search-box">

                <input type="text" placeholder="Tìm điện thoại...">

                <button>
                    <i class="fa fa-search"></i>
                </button>

            </div>

            <!-- CART -->

            <a href="cart.html" class="cart">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>

            <!-- LOGIN -->

            <a href="login.html" class="btn-header" id="btnLogin">
                <i class="fa-solid fa-user"></i> Đăng nhập
            </a>

            <span class="user-name" id="userName" style="display:none;"></span>

            <button id="btnLogout" class="btn-logout" style="display:none;">
                <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
            </button>

        </div>

    </header>

    <!-- CART -->
    <div class="cart-wrapper">

        <div class="cart-header">
            <a href="home.html" class="back">‹ Về trang chủ PhoneShop</a>
            <span class="title">Giỏ hàng của bạn</span>
        </div>

        <!-- LIST -->
        <div class="cart-box">

            <div id="cartList"></div>

            <div class="summary">
                <span>Tạm tính:</span>
                <strong id="tong">0₫</strong>
            </div>

            <!-- CHECKOUT FORM -->
            <div class="checkout-box">

                <h3>Thông tin khách hàng</h3>

                <div class="form-row">
                    <div class="form-group">
                        <input type="text" id="fullName" placeholder="Họ và tên">
                        <small class="error" id="errName"></small>
                    </div>

                    <div class="form-group">
                        <input type="text" id="phone" placeholder="Số điện thoại">
                        <small class="error" id="errPhone"></small>
                    </div>
                </div>

                <h3>Địa chỉ nhận hàng</h3>

                <div class="form-group">
                    <input type="text" id="address" placeholder="Số nhà, tên đường">
                    <small class="error" id="errAddress"></small>
                </div>

                <textarea id="note" placeholder="Ghi chú (nếu có)"></textarea>

                <!-- VOUCHER -->
                <div class="voucher-box">
                    <input id="voucher" placeholder="Nhập mã giảm giá">

                    <button type="button" onclick="toggleVoucherList()">
                        Chọn mã
                    </button>
                </div>

                <div id="voucherList" class="voucher-list"></div>

                <!-- BUTTON -->
                <button class="order-btn" id="orderBtn" onclick="checkout()" disabled>
                    Đặt hàng
                </button>

            </div>

        </div>

    </div>

    <!-- JS -->
    <script src="../js/home.js"></script>
    <script src="../js/loadCategoriesUser.js"></script>
    <script src="../js/auth-check.js"></script>
    <script src="../js/cart.js"></script>

</body>
</html>

<script>
    const fullName = document.getElementById("fullName");
    const phone = document.getElementById("phone");
    const address = document.getElementById("address");
    const btn = document.getElementById("orderBtn");

    function validate() {

        let valid = true;

        if (!fullName.value.trim()) {
            document.getElementById("errName").innerText = "Vui lòng nhập tên";
            valid = false;
        } else {
            document.getElementById("errName").innerText = "";
        }

        const phoneRegex = /^[0-9]{9,11}$/;
        if (!phoneRegex.test(phone.value.trim())) {
            document.getElementById("errPhone").innerText = "SĐT không hợp lệ";
            valid = false;
        } else {
            document.getElementById("errPhone").innerText = "";
        }

        if (!address.value.trim()) {
            document.getElementById("errAddress").innerText = "Nhập địa chỉ";
            valid = false;
        } else {
            document.getElementById("errAddress").innerText = "";
        }

        btn.disabled = !valid;
    }

    fullName.addEventListener("input", validate);
    phone.addEventListener("input", validate);
    address.addEventListener("input", validate);

    // 🔥 QUAN TRỌNG
    validate(); // gọi khi load
</script>
