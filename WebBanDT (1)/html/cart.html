<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Giỏ Hàng</title>

    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="../css/home.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-container">

            <a href="home.html" class="logo">
                <img src="../img/logo.jpg">
                <span>PhoneShop</span>
            </a>

            <div class="dropdown">
                <button class="dropbtn">
                    Danh mục <i class="fa fa-chevron-down"></i>
                </button>
                <div class="dropdown-content" id="categoryMenu"></div>
            </div>

            <div class="search-box">
                <input type="text" placeholder="Tìm điện thoại...">
                <button><i class="fa fa-search"></i></button>
            </div>

            <a href="cart.html" class="cart">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>

            <a href="login.html" class="btn-header" id="btnLogin">
                <i class="fa-solid fa-user"></i> Đăng nhập
            </a>

            <span class="user-name" id="userName" style="display:none;"></span>

            <button id="btnLogout" class="btn-logout" style="display:none;">
                <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
            </button>

        </div>
    </header>

    <!-- CART -->
    <div class="cart-wrapper">

        <div class="cart-header">
            <a href="home.html" class="back">‹ Về trang chủ PhoneShop</a>
            <span class="title">Giỏ hàng của bạn</span>
        </div>

        <!-- LIST -->
        <div class="cart-box">

            <div id="cartList"></div>

            <div class="summary">
                <span>Tạm tính:</span>
                <strong id="tong">0₫</strong>
            </div>

            <!-- CHECKOUT FORM -->
            <div class="checkout-box">

                <h3>Thông tin khách hàng</h3>

                <div class="form-row">
                    <input type="text" id="fullName" placeholder="Họ và tên">
                    <input type="text" id="phone" placeholder="Số điện thoại">
                </div>

                <h3>Địa chỉ nhận hàng</h3>

                <div class="form-column">
                    <input type="text" id="address" placeholder="Số nhà, tên đường">
                </div>

                <textarea id="note" placeholder="Ghi chú (nếu có)"></textarea>

                <input id="voucher" placeholder="Nhập mã giảm giá">

                <button class="order-btn" onclick="checkout()">
                    Đặt hàng
                </button>

            </div>

        </div>

    </div>

    <!-- JS -->
    <script src="../js/home.js"></script>
    <script src="../js/loadCategoriesUser.js"></script>
    <script src="../js/auth-check.js"></script>
    <script src="../js/cart.js"></script>

</body>

</html>
