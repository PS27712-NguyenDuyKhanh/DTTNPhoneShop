<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Giỏ Hàng</title>

    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="../css/home.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-container">

            <a href="home.html" class="logo">
                <img src="../img/logo.jpg">
                <span>PhoneShop</span>
            </a>

            <div class="dropdown">
                <button class="dropbtn">
                    Danh mục <i class="fa fa-chevron-down"></i>
                </button>
                <div class="dropdown-content" id="categoryMenu"></div>
            </div>

            <div class="search-box">
                <input type="text" placeholder="Tìm điện thoại...">
                <button><i class="fa fa-search"></i></button>
            </div>

            <a href="cart.html" class="cart">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>

            <a href="login.html" class="btn-header" id="btnLogin">
                <i class="fa-solid fa-user"></i> Đăng nhập
            </a>

            <span class="user-name" id="userName" style="display:none;"></span>

            <button id="btnLogout" class="btn-logout" style="display:none;">
                <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
            </button>

        </div>
    </header>

    <!-- CART -->
    <div class="cart-wrapper">

        <div class="cart-header">
            <a href="home.html" class="back">‹ Về trang chủ PhoneShop</a>
            <span class="title">Giỏ hàng của bạn</span>
        </div>

        <!-- LIST -->
        <div class="cart-box">

            <div id="cartList"></div>

            <div class="summary">
                <span>Tạm tính:</span>
                <strong id="tong">0₫</strong>
            </div>

        </div>

    </div>

    <!-- JS -->
    <script src="../js/home.js"></script>
    <script src="../js/loadCategoriesUser.js"></script>
    <script src="../js/auth-check.js"></script>

    <script>

function getToken(){
    return sessionStorage.getItem("token");
}

function buildImageUrl(img){
    if(!img) return "";

    if(img.startsWith("http")) return img;

    if(img.startsWith("/")) return "http://localhost:8081" + img;

    return "http://localhost:8081/uploads/" + img;
}

function formatPrice(price) {
    return price.toLocaleString("vi-VN") + "₫";
}

// ==========================
// RENDER CART
// ==========================

function renderCart(data) {

    const cartList = document.getElementById("cartList");
    const tong = document.getElementById("tong");

    cartList.innerHTML = "";

    if (!data || !data.items || data.items.length === 0) {
        cartList.innerHTML = "<p>Giỏ hàng của bạn đang trống</p>";
        tong.innerText = "0₫";
        return;
    }

    let total = 0;

    data.items.forEach(item => {

        const name = item.productName;
        const price = item.price;
        const quantity = item.quantity;
        const img = buildImageUrl(item.image);

        total += price * quantity;

        cartList.insertAdjacentHTML("beforeend", `
<div class="cart-item">

    <img src="${img}">

    <div class="cart-info">
        <h4>${name}</h4>

        <div class="row">
            <span class="remove" onclick="removeItem(${item.id})">× Xóa</span>
        </div>
    </div>

    <div class="cart-right">
        <div class="price">
            <span class="new">${formatPrice(price)}</span>
        </div>

        <div class="cart-qty">
            <button onclick="updateQty(${item.id}, ${Math.max(1, quantity - 1)})">-</button>
            <input value="${quantity}">
            <button onclick="updateQty(${item.id}, ${quantity + 1})">+</button>
        </div>
    </div>

</div>
        `);
    });

    tong.innerText = formatPrice(total);
}

// ==========================
// LOAD CART
// ==========================

async function loadCart() {

    const token = getToken();

    if (!token) {
        alert("Vui lòng đăng nhập");
        window.location.href = "login.html";
        return;
    }

    try {

        const res = await fetch("http://localhost:8081/api/cart", {
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        if (!res.ok) {

            if (res.status === 401 || res.status === 403) {
                alert("Hết phiên đăng nhập!");
                window.location.href = "login.html";
            }

            return;
        }

        const data = await res.json();

        renderCart(data);

    } catch (err) {

        console.error(err);
        alert("Lỗi server");

    }
}

// ==========================
// REMOVE ITEM (FIX)
// ==========================

async function removeItem(id) {

    const token = getToken();

    await fetch(`http://localhost:8081/api/cart/item/${id}`, {
        method: "DELETE",
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    loadCart();
}

// ==========================
// UPDATE QTY (FIX CHUẨN)
// ==========================

async function updateQty(id, qty) {

    const token = getToken();

    const res = await fetch(`http://localhost:8081/api/cart/item/${id}?quantity=${qty}`, {
        method: "PUT",
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    if (!res.ok) {

        if (res.status === 401 || res.status === 403) {
            alert("Phiên đăng nhập hết hạn!");
            window.location.href = "login.html";
        }

        return;
    }

    loadCart();
}

// ==========================
// INIT
// ==========================

document.addEventListener("DOMContentLoaded", loadCart);

</script>

</body>

</html>
